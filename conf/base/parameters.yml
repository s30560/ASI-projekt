
split_params:
  test_size: 0.2
  random_state: 42

numeric_features:
  - Administrative
  - Administrative_Duration
  - Informational
  - Informational_Duration
  - ProductRelated
  - ProductRelated_Duration
  - BounceRates
  - ExitRates
  - SpecialDay

categorical_features:
  - Month
  - OperatingSystems
  - Browser
  - Region
  - TrafficType
  - VisitorType
  - Weekend
raw_data_path: data/01_raw/online_shoppers/online_shoppers_intention.csv

wandb:
  project: asi-projekt
  entity: projekt-asi
  group: sprint3
  mode: online

autogluon:
  enabled: true
  eval_metric: f1
  output_dir: data/06_models/autogluon
  verbosity: 1
  experiments:

    - name: ag_gbm_cat_medium
      presets: medium_quality
      time_limit: 120
      hyperparameters:
        GBM: {}
        CAT: {}

    - name: ag_good_quality
      presets: good_quality
      time_limit: 300


comparison:
  baseline_package_dir: data/06_models/baseline_package
  memory_sample_rows: 5
